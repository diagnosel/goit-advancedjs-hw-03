<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image search</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Image search</h1>
      <form class="form">
        <label
          ><span class="visually-hidden">Search images</span
          ><input
            type="text"
            name="search-text"
            placeholder="Search images..."
            maxlength="100"
            required /></label
        ><button type="submit">Search</button>
      </form>
      <div class="loader-container" role="status" aria-live="polite">
        <span class="loader" aria-hidden="true"></span
        ><span class="visually-hidden">Loading images</span>
      </div>
      <ul class="gallery" aria-label="Search results"></ul>
      <p class="attribution">
        Images from
        <a href="https://pixabay.com/" target="_blank" rel="noopener noreferrer"
          >Pixabay</a
        >
      </p>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
